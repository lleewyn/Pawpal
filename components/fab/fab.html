<div class="fab-stack" id="fabStack">

    <div class="fab-item fab-item--ai" id="fabAiBtn" title="Chat với AI PawPal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"></path>
            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
            <path d="M2 14h2"></path>
            <path d="M20 14h2"></path>
            <path d="M15 13v2"></path>
            <path d="M9 13v2"></path>
        </svg>
        <span class="fab-tooltip">Hỏi AI PawPal</span>
    </div>

    <a class="fab-item fab-item--messenger" href="https://m.me/pawpal" target="_blank" rel="noopener" title="Chat Messenger">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.145 2 11.259c0 2.822 1.32 5.344 3.397 7.04V22l3.104-1.708A11.06 11.06 0 0 0 12 20.52c5.523 0 10-4.146 10-9.26C22 6.144 17.523 2 12 2zm1.007 12.47-2.548-2.717-4.973 2.716 5.467-5.798 2.61 2.717 4.91-2.717-5.466 5.799z"/>
        </svg>
        <span class="fab-tooltip">Messenger</span>
    </a>

    <a class="fab-item fab-item--zalo" href="https://zalo.me/0774561496" target="_blank" rel="noopener" title="Chat Zalo">
        <img src="/assets/images/publics/zalo.webp" alt="Zalo" class="ui-avatar-1">
        <span class="fab-tooltip">Chat Zalo</span>
    </a>

    <a class="fab-item fab-item--phone" href="tel:0774561496" title="Gọi hotline">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12.6a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.44 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span class="fab-tooltip">0774 561 496</span>
    </a>

    <button class="fab-item fab-item--booking" id="fabBookingBtn" title="Đặt lịch ngay" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
        <span class="fab-tooltip">Lên đầu trang</span>
    </button>

</div>

<div class="fab-chatbot-panel" id="fabChatPanel">
    <!-- Header chính -->
    <div class="fab-chat-header">
        <div class="fab-chat-title">
            <span id="fabChatTitleText">PawPal AI</span>
            <span class="fab-chat-status" id="fabChatStatus">Trực tuyến</span>
        </div>
        <div class="fab-chat-header-actions">
            <button class="fab-chat-handover-btn" id="fabHandoverBtn" title="Gặp chuyên viên tư vấn trực tiếp">Gặp chuyên viên</button>
            <button class="fab-chat-icon-btn" id="fabChatNewBtn" aria-label="Đoạn chat mới" title="Bắt đầu đoạn chat mới">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </button>
            <button class="fab-chat-icon-btn" id="fabChatHistoryBtn" aria-label="Lịch sử chat" title="Lịch sử các đoạn chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </button>
            <button class="fab-chat-icon-btn" id="fabChatExpand" aria-label="Mở rộng" title="Mở rộng hoặc thu nhỏ">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
            </button>
            <button class="fab-chat-icon-btn" id="fabChatClose" aria-label="Đóng" title="Đóng khung chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Màn hình Lịch sử các đoạn chat (History Drawer View) -->
    <div class="fab-chat-history-view" id="fabChatHistoryView" style="display: none;">
        <div class="fab-history-subbar">
            <button class="fab-history-back-btn" id="fabHistoryBackBtn" title="Quay lại đoạn chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Quay lại</span>
            </button>
            <span class="fab-history-title">Các đoạn chat trước</span>
            <button class="fab-history-new-btn" id="fabHistoryNewBtn">Chat mới</button>
        </div>
        <div class="fab-history-list" id="fabHistoryList">
            <div class="fab-history-empty">Chưa có đoạn chat nào trước đó.</div>
        </div>
    </div>

    <!-- Màn hình Chat chính -->
    <div class="fab-chat-main-view" id="fabChatMainView">
        <div class="fab-toxic-banner" id="fabToxicBanner" style="display: none;"></div>
        <div class="fab-chat-messages" id="fabChatMessages">
            <div class="fab-chat-bubble fab-chat-bubble--bot">
                Xin chào! Tôi là trợ lý AI của PawPal <br>
                Bạn cần tư vấn về dịch vụ nào?
            </div>
            <div class="fab-chat-suggestions">
                <button class="fab-chat-suggest">Dịch vụ Spa và Grooming</button>
                <button class="fab-chat-suggest">Pet Hotel giá bao nhiêu?</button>
                <button class="fab-chat-suggest">Cần chuẩn bị gì khi gửi bé?</button>
                <button class="fab-chat-suggest fab-chat-suggest--agent">Gặp nhân viên tư vấn</button>
            </div>
        </div>
        <div class="fab-toxic-countdown" id="fabToxicCountdown" style="display: none;"></div>
        <div class="fab-chat-input-row">
            <input type="text" id="fabChatInput" class="fab-chat-input" placeholder="Nhập câu hỏi...">
            <button class="fab-chat-send" id="fabChatSend" aria-label="Gửi">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>
