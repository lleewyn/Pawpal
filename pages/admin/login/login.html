<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị • Pawpal-er</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pages/admin/admin.css?v=42">
    <link rel="stylesheet" href="/pages/admin/login/login.css?v=3">
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        <!-- BƯỚC 1: BIỂU MẪU ĐĂNG NHẬP CHÍNH -->
        <div class="step-section active" id="sectionLogin">
            <h1 class="login-title">Cổng quản trị Pawpal-er</h1>

            <div class="admin-login-error" id="loginErrorMessage"></div>

            <form id="formAdminLogin" autocomplete="on">
                <div class="login-form-group">
                    <label class="login-label" for="inputAdminEmail">Email công vụ</label>
                    <input type="email" class="admin-input" id="inputAdminEmail" placeholder="ten.nv@pawpal.vn" required autofocus autocomplete="username">
                </div>

                <div class="login-form-group">
                    <label class="login-label" for="inputAdminPassword">Mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="admin-input" id="inputAdminPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-view" id="btnTogglePasswordView">Hiện</button>
                    </div>
                </div>

                <button type="submit" class="admin-btn admin-btn-primary" id="btnSubmitAdminLogin" style="width: 100%; height: 42px; font-size: 14px; margin-top: 8px;">
                    Đăng nhập hệ thống
                </button>
            </form>

            <div class="login-footer-info">
                <span>Bạn là khách hàng sử dụng dịch vụ?</span>
                <br>
                <a href="/login">Đăng nhập tại cổng khách hàng</a>
            </div>
        </div>

        <!-- BƯỚC 2: YÊU CẦU ĐỔI MẬT KHẨU LẦN ĐẦU (KHI CÓ CỜ MUST_CHANGE_PASSWORD) -->
        <div class="step-section" id="sectionFirstChangePassword">
            <h2 class="login-title">Đổi mật khẩu khởi tạo</h2>

            <div class="admin-login-error" id="changePassErrorMessage"></div>

            <form id="formFirstChangePassword">
                <div class="login-form-group">
                    <label class="login-label" for="inputNewPassword">Mật khẩu mới</label>
                    <input type="password" class="admin-input" id="inputNewPassword" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
                </div>

                <div class="login-form-group">
                    <label class="login-label" for="inputConfirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" class="admin-input" id="inputConfirmPassword" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
                </div>

                <button type="submit" class="admin-btn admin-btn-primary" id="btnSubmitChangePass" style="width: 100%; height: 42px; font-size: 14px; margin-top: 8px;">
                    Lưu mật khẩu và vào hệ thống
                </button>
            </form>
        </div>
    </div>

    <!-- Nạp Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/scripts/api/supabase-client.js"></script>

    <!-- Script xử lý Đăng nhập & Xác thực Quản trị -->
    <script src="/pages/admin/login/login.js?v=2"></script>
</body>
</html>
