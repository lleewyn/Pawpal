<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị • Pawpal-er</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pages/admin/admin.css?v=42">
    <link rel="stylesheet" href="/pages/admin/login/login.css?v=13">
</head>
<body class="admin-login-body">

    <header class="login-site-header"><a href="/" class="login-brand">PawPal<span>Quản trị</span></a><a href="/" class="login-home-link">Về trang khách hàng</a></header>
    <div class="login-workspace">
    <div class="login-scene">
    <img class="login-cat" src="/assets/images/admin/login-cat.webp" alt="" aria-hidden="true" fetchpriority="high" width="768" height="1024">
    <img class="login-cat login-cat-paw-top" src="/assets/images/admin/login-cat.webp" alt="" aria-hidden="true" width="768" height="1024">
    <img class="login-cat login-cat-paw-side" src="/assets/images/admin/login-cat.webp" alt="" aria-hidden="true" width="768" height="1024">
    <main class="admin-login-card" aria-label="Đăng nhập quản trị">
        <!-- BƯỚC 1: BIỂU MẪU ĐĂNG NHẬP CHÍNH -->
        <div class="step-section active" id="sectionLogin">
            <div class="login-eyebrow">Không gian làm việc PawPal</div>
            <h1 class="login-title">Đăng nhập quản trị</h1>

            <div class="admin-login-error" id="loginErrorMessage" role="alert"></div>

            <form id="formAdminLogin" autocomplete="on" onsubmit="return false;">
                <div class="login-form-group">
                    <label class="login-label" for="inputAdminEmail">Email công vụ <span class="login-required">*</span></label>
                    <input type="email" class="admin-input" id="inputAdminEmail" placeholder="ten.nv@pawpal.vn" required autofocus autocomplete="username">
                </div>

                <div class="login-form-group">
                    <label class="login-label" for="inputAdminPassword">Mật khẩu <span class="login-required">*</span></label>
                    <div class="password-input-wrapper">
                        <input type="password" class="admin-input" id="inputAdminPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-view" id="btnTogglePasswordView" aria-controls="inputAdminPassword" aria-pressed="false" aria-label="Hiện mật khẩu">Hiện</button>
                    </div>
                </div>

                <button type="submit" class="admin-btn admin-btn-primary" id="btnSubmitAdminLogin" style="width: 100%; height: 42px; font-size: 14px; margin-top: 8px;">
                    Đăng nhập hệ thống
                </button>
            </form>

            <div class="login-footer-info">
                <span>Bạn là khách hàng sử dụng dịch vụ?</span>
                <br>
                <a href="/login">Đăng nhập tại cổng khách hàng</a>
            </div>
        </div>

        <!-- BƯỚC 2: YÊU CẦU ĐỔI MẬT KHẨU LẦN ĐẦU (KHI CÓ CỜ MUST_CHANGE_PASSWORD) -->
        <div class="step-section" id="sectionFirstChangePassword">
            <h2 class="login-title">Đổi mật khẩu khởi tạo</h2>

            <div class="admin-login-error" id="changePassErrorMessage" role="alert"></div>

            <form id="formFirstChangePassword" onsubmit="return false;">
                <div class="login-form-group">
                    <label class="login-label" for="inputNewPassword">Mật khẩu mới <span class="login-required">*</span></label>
                    <input type="password" class="admin-input" id="inputNewPassword" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
                </div>

                <div class="login-form-group">
                    <label class="login-label" for="inputConfirmPassword">Xác nhận mật khẩu mới <span class="login-required">*</span></label>
                    <input type="password" class="admin-input" id="inputConfirmPassword" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
                </div>

                <button type="submit" class="admin-btn admin-btn-primary" id="btnSubmitChangePass" style="width: 100%; height: 42px; font-size: 14px; margin-top: 8px;">
                    Lưu mật khẩu và vào hệ thống
                </button>
            </form>
        </div>
    </main>
    </div>
    </div>

    <!-- Nạp Supabase Client -->
    <script src="/scripts/vendor/supabase.js"></script>
    <script>window.__PAWPAL_SUPABASE_CONFIG__={required:true};</script>
    <script src="/api/admin-config"></script>
    <script src="/scripts/api/supabase-client.js"></script>

    <!-- Script xử lý Đăng nhập & Xác thực Quản trị -->
    <script src="/pages/admin/login/login.js?v=20261104_roles_phase3"></script>
</body>
</html>
