<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị vận hành - Xem trước</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pages/admin/admin.css?v=43">
<link rel="stylesheet" href="/pages/admin/admin-components.css?v=20261106_staff_copilot_ui">
<link rel="stylesheet" href="/pages/admin/modules/dashboard-operations/dashboard-operations.css">
<style>
    /* Trang xem trước độc lập để phát triển tab trước khi gắn vào khung Dashboard; không dùng trong sản phẩm. */
    /* admin.css khóa cuộn ở html (AGENTS.md: khóa khung màn hình). Như khung Admin, chỉ vùng nội dung bên trong được cuộn. */
    body { margin: 0; height: 100vh; overflow: hidden; background: var(--canvas-bg, #EDF4F0); font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .ops-preview-scroll { height: 100vh; overflow-y: auto; overscroll-behavior: contain; }
    .ops-preview { max-width: 1440px; margin: 0 auto; padding: 24px 28px 40px; }
    .ops-preview-message { margin: 40px auto; max-width: 560px; color: var(--text-main, #203A2C); font-size: 14px; line-height: 1.6; }
    .ops-preview-message a { color: #236B48; font-weight: 600; }
</style>
</head>
<body>
<div class="ops-preview-scroll"><main class="ops-preview" id="opsPreview"></main></div>
<script src="/scripts/vendor/supabase.js"></script>
<script src="/api/admin-config"></script>
<script src="/scripts/api/supabase-client.js?v=20261106_realtime_signals"></script>
<script src="/pages/admin/modules/dashboard-operations/operations-metrics.js"></script>
<script src="/pages/admin/modules/dashboard-operations/dashboard-operations.js"></script>
<script>
(async function startPreview() {
    const container = document.getElementById('opsPreview');
    const showMessage = html => { container.innerHTML = `<div class="ops-preview-message">${html}</div>`; };
    const client = window.getSupabaseClient ? window.getSupabaseClient() : window.SupabaseClient;
    if (!client) {
        showMessage('Chưa có cấu hình kết nối Supabase cho Admin. Kiểm tra các biến <strong>PAWPAL_ADMIN_SUPABASE_URL</strong> và <strong>PAWPAL_ADMIN_SUPABASE_ANON_KEY</strong> trong tệp .env rồi khởi động lại máy chủ.');
        return;
    }
    const { data } = await client.auth.getSession();
    if (!data?.session) {
        showMessage('Bạn chưa đăng nhập. Hãy <a href="/admin/login">đăng nhập Admin</a> trong cùng trình duyệt, sau đó tải lại trang này.');
        return;
    }
    try {
        await window.PawpalOperationsDashboard.mount(container);
    } catch (error) {
        console.error('[Xem trước vận hành]', error);
        showMessage('Không mở được tab Quản trị vận hành. Vui lòng tải lại trang.');
    }
})();
</script>
</body>
</html>
