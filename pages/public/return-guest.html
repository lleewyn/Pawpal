<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Tra cứu dịch vụ - PawPal</title>
    <meta name="description" content="Tra cứu dịch vụ chăm sóc thú cưng và đơn hàng của bạn tại PawPal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/chat.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <!-- Page Specific -->
    <link rel="stylesheet" href="../../assets/css/user/pet-diary.css">
    <link rel="stylesheet" href="../../assets/css/public/return-guest.css">
</head>
<body>

    <div id="site-header"></div>

    <main>
        <!-- Hero Search Section (Initial State) -->
        <section class="lookup-hero" id="lookupHero">
            <div class="lookup-hero-content">
                <h1 class="lookup-hero-title">Tra cứu dịch vụ + đơn hàng</h1>
                
                <form class="lookup-search-form" id="lookupForm">
                    <div class="lookup-input-wrapper">
                        <input 
                            type="tel" 
                            class="lookup-phone-input" 
                            id="phoneInput"
                            placeholder="Nhập số điện thoại (10 số)"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                            aria-label="Số điện thoại"
                        />
                    </div>
                    <button type="submit" class="btn-lookup">
                        Tra cứu ngay
                    </button>
                </form>

                <div class="lookup-divider">hoặc</div>

                <p class="lookup-footer-text">
                    Bạn đã có tài khoản? 
                    <a href="/pages/public/login.html" class="login-link">Đăng nhập ngay</a> 
                    để xem tất cả
                </p>

                <!-- Error message (inline, hidden by default) -->
                <div class="lookup-error-inline" id="errorInline" style="display: none;">
                    <p class="error-message" id="errorMessageInline"></p>
                </div>
            </div>
        </section>

        <!-- Results Section (Hidden by default) -->
        <div class="lookup-results-wrapper" id="resultsWrapper" style="display: none;">
            
            <!-- Compact Search Bar -->
            <section class="lookup-compact-bar">
                <div class="container-xl">
                    <div class="compact-bar-content">
                        <div class="compact-search-group">
                            <input 
                                type="tel" 
                                class="compact-phone-input" 
                                id="compactPhoneInput"
                                readonly
                            />
                            <button class="btn-lookup-again" id="btnLookupAgain">
                                Tra cứu lại
                            </button>
                        </div>
                        <div class="lookup-result-count" id="resultCount">
                            <!-- Will be populated by JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Tabs Navigation -->
            <section class="lookup-tabs">
                <div class="container-xl">
                    <div class="lookup-tabs-nav">
                        <button class="lookup-tab active" data-tab="services" id="tabServices">
                            Lịch hẹn dịch vụ <span class="tab-badge" id="servicesBadge">0</span>
                        </button>
                        <button class="lookup-tab" data-tab="orders" id="tabOrders">
                            Đơn hàng sản phẩm <span class="tab-badge" id="ordersBadge">0</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Tab Content -->
            <section class="lookup-content">
                <div class="container-xl">
                    
                    <!-- Tab 1: Services -->
                    <div class="tab-pane active" id="servicesPane">
                        <div class="services-grid" id="servicesGrid">
                            <!-- Service cards will be rendered here -->
                        </div>
                        
                        <!-- Empty State -->
                        <div class="empty-lookup-state" id="emptyServices" style="display: none;">
                            <h3 class="empty-title">Chưa có lịch hẹn nào</h3>
                            <p class="empty-desc">Số điện thoại này chưa đặt dịch vụ nào tại PawPal</p>
                            <a href="/pages/services/booking.html" class="btn-cta">Đặt lịch ngay</a>
                        </div>
                    </div>

                    <!-- Tab 2: Orders -->
                    <div class="tab-pane" id="ordersPane" style="display: none;">
                        <div class="orders-grid" id="ordersGrid">
                            <!-- Order cards will be rendered here -->
                        </div>
                        
                        <!-- Empty State -->
                        <div class="empty-lookup-state" id="emptyOrders" style="display: none;">
                            <h3 class="empty-title">Chưa có đơn hàng nào</h3>
                            <p class="empty-desc">Số điện thoại này chưa mua sản phẩm nào tại PawPal</p>
                            <a href="/pages/shop/shop.html" class="btn-cta">Mua sắm ngay</a>
                        </div>
                    </div>

                </div>
            </section>

        </div>

        <!-- Error State (Full page - REMOVED, now inline only) -->

    </main>

    <div id="site-footer"></div>

    <!-- Toast Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    <script type="module" src="../../assets/js/public/return-guest.js"></script>
    <div id="site-fab"></div>
</body>
</html>
