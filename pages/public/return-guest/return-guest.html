<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Tra cứu lịch / đơn hàng - PawPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles/style.css">
    <link rel="stylesheet" href="return-guest.css">
    <link rel="stylesheet" href="../../user/return-detail/return-detail.css">
    <link rel="stylesheet" href="../../../styles/user/return-detail.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../scripts/shared/header-auth.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    <script src="../../user/return-handler.js" defer></script>
    <script src="return-guest.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main class="rg-page">
        <div class="container-xl">
            <div class="rg-card">
                <h1 class="rg-title">Tra cứu lịch dịch vụ | đơn hàng</h1>

                <!-- Search form -->
                <form id="rg-form" class="rg-form">
                    <label class="rg-label" for="rg-phone">Số điện thoại *</label>
                    <div class="rg-form-row">
                        <input type="tel" id="rg-phone" class="rg-input" placeholder="Ví dụ: 0901234567" required>
                        <button type="submit" class="btn-cta rg-search-btn">Tìm kiếm</button>
                    </div>
                    <div class="rg-error" id="rg-error" style="display:none;">
                        Chưa tìm thấy kết quả nào với số điện thoại này. Vui lòng kiểm tra lại.
                    </div>
                </form>

                <!-- Results -->
                <section id="rg-results" style="display:none;">
                    <h3 class="rg-results-title">Kết quả tìm thấy</h3>
                    <div class="rg-tabs" id="rg-tabs"></div>
                    <div class="rg-list" id="rg-list"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div class="toast-container-custom" id="toastContainer"></div>
    <div id="rma-drawer-container"></div>
    <div id="site-fab"></div>
</body>
</html>
