<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Lịch hẹn của tôi - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../../styles/style.css">
    <!-- Components -->
    <!-- Dashboard base styles -->
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="bookings.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../../../scripts/shared/auth.js" defer></script>
    <script src="../dashboard-init.js"></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../scripts/shared/header-auth.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    <script type="module" src="bookings.js"></script>
    </head>
<body>
    <div id="site-header"></div>

    <main class="bookings-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <!-- Sidebar will be loaded here -->
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="bookings-content">


                        <!-- Filter Tabs -->
                        <div class="filter-tabs mb-4" role="tablist">
                            <button class="filter-tab active" data-status="all" role="tab" aria-selected="true">
                                Tất cả
                            </button>
                            <button class="filter-tab" data-status="confirmed" role="tab" aria-selected="false">
                                Đã xác nhận
                            </button>
                            <button class="filter-tab" data-status="in-progress" role="tab" aria-selected="false">
                                Đang thực hiện
                            </button>
                            <button class="filter-tab" data-status="completed" role="tab" aria-selected="false">
                                Hoàn thành
                            </button>
                            <button class="filter-tab" data-status="cancelled" role="tab" aria-selected="false">
                                Đã hủy
                            </button>
                        </div>

                        <!-- Bookings List -->
                        <div class="bookings-list" id="bookingsList">
                            <!-- Booking cards will be dynamically inserted here by JS -->
                            
                            <!-- Empty State (shown when no bookings) -->
                            <div class="empty-state" id="emptyState">
                                <div class="empty-icon" style="color: var(--color-primary-light);">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                </div>
                                <h4>Chưa có lịch hẹn nào</h4>
                                <p>Các lịch hẹn dịch vụ của bạn sẽ hiển thị ở đây</p>
                                <a href="../../services/booking/booking.html" class="btn-cta">Đặt lịch ngay</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Toast Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <div id="site-fab"></div>
</body>
</html>
