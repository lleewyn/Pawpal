<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Lịch sử chăm sóc - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../../assets/css/user/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/user/pet-diary.css">
    <link rel="stylesheet" href="../../assets/css/user/care-history.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="care-history-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar" style="min-height: 300px;">
                            <p style="text-align: center; padding: 20px; color: #999;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="care-history-content">
                        <!-- Page Header -->
                        <div class="care-history-header mb-4">
                            <h3 class="care-history-page-title">Lịch sử chăm sóc</h3>
                        </div>

                        <!-- Pet Selector -->
                        <div class="pet-selector-wrapper mb-4">
                            <label for="petSelector" class="form-label fw-semibold">Chọn bé cưng</label>
                            <select class="form-select pet-selector" id="petSelector">
                                <option value="">-- Chọn bé cưng để xem lịch sử --</option>
                            </select>
                        </div>

                        <!-- Empty State (shown initially) -->
                        <div class="empty-state-diary" id="emptyState">
                            <div class="empty-icon" style="color: var(--color-primary-light); display: inline-flex; justify-content: center; margin-bottom: var(--space-sm);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 3v5h5"></path>
                                    <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
                                    <path d="M12 7v5l4 2"></path>
                                </svg>
                            </div>
                            <h4 class="empty-title">Chọn bé cưng để xem lịch sử</h4>
                            <p class="empty-desc">Toàn bộ nhật ký chăm sóc theo từng lần dịch vụ sẽ hiển thị tại đây</p>
                        </div>

                        <!-- History Content (hidden initially) -->
                        <div id="historyContent" style="display: none;">

                            <!-- Pet Info Card -->
                            <div class="pet-info-card mb-4" id="petInfoCard">
                                <!-- Will be rendered by JS -->
                            </div>

                            <!-- Session List -->
                            <div class="session-list-header mb-3">
                                <h4 class="session-list-title">Các phiên dịch vụ đã hoàn thành</h4>
                            </div>

                            <div class="session-list" id="sessionList">
                                <!-- Session cards will be rendered here -->
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Toast Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Authentication Guard
        (function() {
            const currentUser = JSON.parse(localStorage.getItem('pawpal_current_user'));
            if (!currentUser) {
                window.location.href = '/pages/public/login.html';
            }
        })();

        // Load sidebar synchronously
        (function loadSidebar() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '../../components/user-sidebar.html', false);
            xhr.send();
            if (xhr.status === 200) {
                document.getElementById('user-sidebar').innerHTML = xhr.responseText;
            }
        })();
    </script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script src="../../assets/js/shared/header-auth.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    <script type="module">
        import { initCareHistory } from '../../assets/js/user/care-history.js';
        document.addEventListener('DOMContentLoaded', initCareHistory);
    </script>
    <div id="site-fab"></div>
</body>
</html>
