<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Trung tâm tài khoản - PawPal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Core Styles -->
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../components/user-sidebar/user-sidebar.css">
    <link rel="stylesheet" href="user.css">

    <!-- Scripts CDN & Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../scripts/api/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../../scripts/shared/auth.js" defer></script>
    <script src="../../scripts/shared/data-loader.js" defer></script>
    <script src="../../scripts/shared/support-handler.js" defer></script>
    <script src="../../scripts/shared/components.js" defer></script>
    <script src="../../components/header/header.js" defer></script>
    <script src="../../scripts/shared/main.js" defer></script>
    <script type="module" src="user.js"></script>
</head>
<body class="user-portal-body">
    <!-- Header chung Pawpal -->
    <header id="site-header"></header>

    <!-- Khung giao diện User Portal -->
    <main class="user-portal-wrapper">
        <div class="container-xl">
            <!-- Nút bật mở Sidebar trên Mobile -->
            <button type="button" class="dashboard-sidebar-toggle d-lg-none" id="userSidebarToggle" aria-controls="user-sidebar" aria-expanded="false">
                <span class="dashboard-sidebar-toggle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                </span>
                <span class="dashboard-sidebar-toggle-text">Menu tài khoản</span>
            </button>
            <div class="dashboard-sidebar-backdrop" id="userSidebarBackdrop" hidden></div>

            <div class="row g-4 align-items-start">
                <!-- Cột trái: User Sidebar -->
                <aside class="col-lg-3 user-portal-sidebar-col">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Đang tải menu...</p>
                        </div>
                    </div>
                </aside>

                <!-- Cột phải: Dynamic Module Content Area -->
                <section class="col-lg-9 user-portal-main-col">
                    <!-- Breadcrumb động -->
                    <nav class="user-breadcrumb mb-3" id="userBreadcrumbNav" aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0" id="userBreadcrumbList">
                            <li class="breadcrumb-item"><a href="/pages/public/landing/landing.html">Trang chủ</a></li>
                            <li class="breadcrumb-item active" id="userBreadcrumbCurrent">Tài khoản</li>
                        </ol>
                    </nav>

                    <!-- Vùng render module nội dung -->
                    <div id="userAppContent" class="user-app-content">
                        <!-- Module content injected here dynamically -->
                        <div class="user-module-loading-box">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Đang tải...</span>
                            </div>
                            <p class="mt-3 text-muted">Đang tải phân hệ...</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Detail Drawer trượt từ phải sang (Xem chi tiết đơn hàng / lịch hẹn tại chỗ) -->
    <div class="user-detail-drawer-backdrop" id="userDetailDrawerBackdrop" hidden></div>
    <aside class="user-detail-drawer" id="userDetailDrawer" aria-hidden="true">
        <div class="user-detail-drawer-header">
            <div class="drawer-header-title" id="drawerHeaderTitle">Chi tiết</div>
            <button type="button" class="btn-drawer-close" id="btnUserDrawerClose" aria-label="Đóng (Esc)">✕</button>
        </div>
        <div class="user-detail-drawer-body" id="userDetailDrawerBody">
            <div class="text-center p-5 text-muted">Đang tải thông tin chi tiết...</div>
        </div>
    </aside>

    <!-- Footer và FAB chung Pawpal -->
    <div id="site-footer"></div>
    <div id="site-fab"></div>
</body>
</html>
