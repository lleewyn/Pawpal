<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>PawPal - Ưu đãi và Thành viên</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../styles/style.css">
    
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="/components/user-sidebar/user-sidebar.css">
    <link rel="stylesheet" href="loyalty.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../scripts/api/supabase-client.js" defer></script>
    <script src="../../../scripts/shared/auth.js" defer></script>
    <script src="loyalty.js" defer></script>
    <script src="../dashboard-init.js"></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../components/header/header.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
</head>
<body>

    <div id="site-header"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <button type="button" class="dashboard-sidebar-toggle d-lg-none" id="dashboardSidebarToggle" aria-controls="user-sidebar" aria-expanded="false">
                <span class="dashboard-sidebar-toggle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                </span>
                <span class="dashboard-sidebar-toggle-text">Tài khoản</span>
            </button>
            <div class="dashboard-sidebar-backdrop" id="dashboardSidebarBackdrop" hidden></div>
            <div class="row g-4">
                
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                
                <div class="col-lg-9">
                    
                    <div id="loyalty-warning-banner" class="loyalty-warning-banner"></div>

                    
                    <div class="dashboard-content-panel">

                        
                        
                        <div id="loyalty-card-wrapper">
                            <p class="text-muted text-center py-4">Đang tải thẻ thành viên...</p>
                        </div>

                        
                        <h3 class="my-vouchers-title mt-5">Voucher của tôi</h3>
                        <div id="my-vouchers-list" class="my-vouchers-wrapper">
                            <p class="text-muted text-center py-4">Đang tải Voucher của tôi...</p>
                        </div>

                        
                        <h3 class="vouchers-section-title mt-5">Ưu đãi đổi điểm thưởng</h3>
                        <div id="vouchers-grid" class="vouchers-grid-wrapper">
                            <p class="text-muted text-center py-4">Đang tải danh sách voucher...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    
    <div id="site-fab"></div>
</body>
</html>
