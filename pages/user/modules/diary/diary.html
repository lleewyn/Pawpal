<!-- modules/diary/diary.html - Module Nhật ký chăm sóc Pawpal -->
<div class="pet-diary-module-container">
    <div class="pet-diary-content">
        <!-- Bộ chọn bé cưng dự phòng (ẩn trên giao diện để dùng thẻ trực quan) -->
        <div class="pet-selector-wrapper mb-4 d-none">
            <label for="petSelector" class="form-label fw-semibold">Chọn bé cưng để theo dõi</label>
            <select class="form-select pet-selector" id="petSelector">
                <option value="">-- Chọn bé cưng để xem nhật ký --</option>
            </select>
        </div>

        <!-- Skeleton Loading trong lúc nạp dữ liệu bé cưng và nhật ký -->
        <div id="diaryLoadingSkeleton" class="diary-loading-skeleton">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="pawpal-skeleton" style="width: 100px; height: 32px; border-radius: 9px;"></span>
                    <span class="pawpal-skeleton" style="width: 100px; height: 32px; border-radius: 9px;"></span>
                </div>
                <span class="pawpal-skeleton" style="width: 110px; height: 36px; border-radius: 9px;"></span>
            </div>
            <div class="skeleton-box mb-4 d-flex align-items-center gap-3">
                <span class="pawpal-skeleton" style="width: 72px; height: 72px; border-radius: 50%;"></span>
                <div class="d-flex flex-column gap-2 flex-grow-1">
                    <span class="pawpal-skeleton" style="width: 160px; height: 18px;"></span>
                    <span class="pawpal-skeleton" style="width: 260px; height: 14px;"></span>
                </div>
            </div>
            <div class="skeleton-box mb-4 p-3">
                <span class="pawpal-skeleton" style="width: 100%; height: 50px;"></span>
            </div>
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="skeleton-box d-flex flex-column gap-3">
                        <span class="pawpal-skeleton" style="width: 100%; height: 140px;"></span>
                        <span class="pawpal-skeleton" style="width: 100%; height: 140px;"></span>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="skeleton-box d-flex flex-column gap-3">
                        <span class="pawpal-skeleton" style="width: 100%; height: 280px;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trạng thái trống dự phòng khi chưa có bé cưng nào -->
        <div id="dashboardState" class="d-none">
            <div class="empty-state-diary" id="emptyState">
                <h4 class="empty-title">Chưa có hồ sơ bé cưng</h4>
                <p class="empty-desc">Bạn chưa đăng ký bé cưng nào trong hệ thống. Hãy thêm bé cưng để theo dõi nhật ký chăm sóc thời gian thực!</p>
                <a href="#pets" class="btn-add-pet-cta">+ Thêm bé cưng ngay</a>
            </div>
        </div>

        <!-- Chi tiết nhật ký của bé cưng đã chọn -->
        <div class="diary-content-wrapper d-none" id="diaryContent">
            <!-- Thanh điều hướng chọn bé nhanh và Đặt lịch mới -->
            <div class="diary-detail-nav mb-4" id="diaryDetailNav">
                <div class="pet-switcher-container" id="petSwitcherContainer">
                    <span class="switcher-label">Theo dõi nhật ký:</span>
                    <div class="pet-switcher-pills" id="petSwitcherPills"></div>
                </div>
                <div class="diary-nav-actions">
                    <a href="#booking" class="btn-diary-cta-booking" title="Đặt lịch dịch vụ mới cho bé">+ Đặt lịch mới</a>
                </div>
            </div>

            <!-- Thẻ thông tin bé cưng -->
            <div class="pet-info-card mb-4" id="petInfoCard"></div>

            <!-- Thanh tiến trình dịch vụ thời gian thực (Live Service Stepper) -->
            <div class="service-stepper-card mb-4" id="serviceStepperCard"></div>

            <div class="row g-4 align-items-start">
                <!-- Dòng thời gian cập nhật -->
                <div class="col-lg-8">
                    <div class="timeline-header mb-3">
                        <h4 class="timeline-title m-0">Dòng thời gian</h4>
                    </div>
                    <div class="timeline-wrapper" id="timelineWrapper"></div>
                    <div class="empty-timeline d-none" id="emptyTimeline">
                        <p class="empty-desc text-muted">Đang chờ cập nhật từ nhân viên chăm sóc</p>
                    </div>
                </div>

                <!-- Cột lịch sử dịch vụ -->
                <div class="col-lg-4">
                    <div class="history-header mb-3">
                        <h4 class="timeline-title m-0">Lịch sử dịch vụ</h4>
                        <span class="history-count-badge" id="historyCountBadge">0 ca</span>
                    </div>
                    <div class="history-sidebar">
                        <div class="history-list" id="historyList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal phóng to ảnh dòng thời gian -->
        <div class="diary-image-modal" id="diaryImageModal" tabindex="-1" style="display: none;">
            <div class="diary-modal-backdrop" id="diaryModalBackdrop"></div>
            <div class="diary-modal-dialog">
                <button class="diary-modal-close" id="diaryModalClose" type="button" aria-label="Đóng">×</button>
                <img src="" alt="Ảnh mốc thời gian" id="diaryModalImg" class="diary-modal-img">
                <div class="diary-modal-caption" id="diaryModalCaption"></div>
            </div>
        </div>
    </div>
</div>
