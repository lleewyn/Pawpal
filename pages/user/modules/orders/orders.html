<!-- modules/orders/orders.html - Module Quản lý đơn hàng Pawpal -->
<div class="orders-module-container">
    <!-- Thống kê đơn hàng -->
    <section class="orders-stats mb-4">
        <div class="stat-card">
            <span class="stat-number" id="processing-count">0</span>
            <span class="stat-label">Đang xử lý</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="completed-count">0</span>
            <span class="stat-label">Hoàn thành</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="total-spent">0đ</span>
            <span class="stat-label">Tổng chi tiêu</span>
        </div>
    </section>

    <!-- Thanh tìm kiếm -->
    <div class="orders-search mb-3">
        <input type="text" id="order-search" 
               placeholder="Tìm kiếm theo mã đơn hàng hoặc tên sản phẩm..."
               class="search-input">
        <button class="search-btn" id="search-btn">Tìm kiếm</button>
    </div>

    <!-- Thanh lọc trạng thái đơn hàng -->
    <nav class="orders-tabs mb-4" id="orders-tabs">
        <button class="tab-btn active" data-status="all">
            Tất cả <span class="tab-count" id="count-all">(0)</span>
        </button>
        <button class="tab-btn" data-status="pending_payment">
            Chờ thanh toán <span class="tab-count" id="count-pending_payment">(0)</span>
        </button>
        <button class="tab-btn" data-status="preparing">
            Đang chuẩn bị <span class="tab-count" id="count-preparing">(0)</span>
        </button>
        <button class="tab-btn" data-status="shipping">
            Đang giao <span class="tab-count" id="count-shipping">(0)</span>
        </button>
        <button class="tab-btn" data-status="delivered">
            Đã giao <span class="tab-count" id="count-delivered">(0)</span>
        </button>
        <button class="tab-btn" data-status="completed">
            Hoàn thành <span class="tab-count" id="count-completed">(0)</span>
        </button>
        <button class="tab-btn" data-status="cancelled">
            Đã hủy <span class="tab-count" id="count-cancelled">(0)</span>
        </button>
    </nav>

    <!-- Danh sách đơn hàng -->
    <div class="orders-list" id="orders-list">
        <div class="text-center p-5 text-muted">Đang tải danh sách đơn hàng...</div>
    </div>

    <!-- Phân trang -->
    <nav class="pagination d-none mt-4 justify-content-center" id="pagination">
        <button class="page-btn" id="prev-page">&lt;</button>
        <div id="page-numbers" class="d-inline-flex gap-1"></div>
        <button class="page-btn" id="next-page">&gt;</button>
    </nav>

    <!-- Container cho Drawer đổi trả / đánh giá nếu có -->
    <div id="rma-drawer-container"></div>
</div>
