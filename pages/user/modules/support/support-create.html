<div class="support-create-container"><div class="dashboard-content-panel">
    <div class="d-flex justify-content-end mb-3"><a href="#support" class="btn-cancel-link">Danh sách phiếu</a></div>
    <form id="createComplaintForm" class="support-create-form" onsubmit="return false;">
        <div class="form-group mb-3"><label for="ticketType" class="form-label">Phân loại <span class="text-danger">*</span></label><select id="ticketType" class="form-select"><option value="">Chọn loại yêu cầu</option><option value="service">Phản ánh dịch vụ</option><option value="order">Phản ánh đơn hàng</option><option value="payment">Hỗ trợ thanh toán</option><option value="other">Yêu cầu khác</option></select></div>
        <div id="serviceContextSection" class="d-none mb-3"><label for="serviceBookingSearch" class="form-label">Lịch hẹn <span class="text-danger">*</span></label><div style="position:relative"><input id="serviceBookingSearch" class="form-control" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="serviceBookingOptions"><input type="hidden" id="serviceBookingSelect"><div id="serviceBookingOptions" class="autocomplete-dropdown" role="listbox" hidden style="position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:2500;background:#fff;border:1px solid #ECF2EE;border-radius:9px;max-height:240px;overflow:auto;overscroll-behavior:contain"></div></div><p id="serviceSummaryBox" class="mt-2" role="status"></p></div>
        <div id="orderContextSection" class="d-none mb-3"><label for="orderSearch" class="form-label">Đơn hàng <span class="text-danger">*</span></label><div style="position:relative"><input id="orderSearch" class="form-control" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="orderOptions"><input type="hidden" id="orderSelect"><div id="orderOptions" class="autocomplete-dropdown" role="listbox" hidden style="position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:2500;background:#fff;border:1px solid #ECF2EE;border-radius:9px;max-height:240px;overflow:auto;overscroll-behavior:contain"></div></div></div>
        <div class="form-group mb-3"><label for="ticketTitle" class="form-label">Chủ đề <span class="text-danger">*</span></label><input id="ticketTitle" class="form-control" maxlength="200" required></div>
        <div class="form-group mb-3"><label for="ticketContent" class="form-label">Nội dung <span class="text-danger">*</span></label><textarea id="ticketContent" class="form-control" rows="5" maxlength="4000" required></textarea></div>
        <p id="supportCreateError" role="alert" style="color:#DC2626"></p>
        <div class="d-flex justify-content-end gap-3"><a href="#support" class="btn-cancel-link">Hủy bỏ</a><button type="button" class="btn-support-submit" id="btnSubmitComplaint" disabled>Đang tải…</button></div>
    </form>
</div></div>
