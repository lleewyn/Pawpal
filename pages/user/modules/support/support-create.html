<!-- modules/support/support-create.html - Tạo Khiếu nại và Yêu cầu Hỗ trợ (Chuẩn AGENTS.md) -->
<div class="support-create-container">
    <div class="dashboard-content-panel">
        <div class="d-flex justify-content-end align-items-center mb-3">
            <a href="#support" class="btn-cancel-link text-decoration-none">Danh sách phiếu</a>
        </div>

        <form id="createComplaintForm" class="support-create-form">
            <!-- 1. Phân loại sự cố -->
            <div class="form-group mb-3">
                <label for="ticketType" class="form-label fw-bold">Phân loại sự cố <span class="text-danger">*</span></label>
                <select id="ticketType" class="form-select support-form-select" required>
                    <option value="">-- Vui lòng chọn phân loại sự cố --</option>
                    <option value="service">Sự cố Dịch vụ (Spa Grooming / Pet Hotel / Pet Taxi)</option>
                    <option value="order">Sự cố Đơn hàng Shop (Giao sai / Hàng lỗi / Bể vỡ)</option>
                    <option value="payment">Sự cố Thanh toán và Giao dịch (MoMo / VNPAY / Hoàn tiền)</option>
                    <option value="other">Yêu cầu và Phản ánh khác</option>
                </select>
            </div>

            <!-- 2. Ngữ cảnh Dịch vụ (Hiện khi chọn service) -->
            <div id="serviceContextSection" class="p-3 mb-3 border rounded-3 d-none support-context-box">
                <div class="d-flex align-items-center gap-2 mb-2 fw-bold text-heading">
                    <span>Thông tin ca dịch vụ cần phản ánh</span>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-7">
                        <label for="serviceBookingSelect" class="form-label small fw-semibold">Chọn ca dịch vụ gần đây <span class="text-danger">*</span></label>
                        <select id="serviceBookingSelect" class="form-select form-select-sm">
                            <option value="">-- Đang tải danh sách lịch hẹn... --</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="serviceIssueType" class="form-label small fw-semibold">Vấn đề gặp phải <span class="text-danger">*</span></label>
                        <select id="serviceIssueType" class="form-select form-select-sm">
                            <option value="injury">Bé bị đau / trầy xước / rớm máu sau ca</option>
                            <option value="styling">Cắt tỉa / Tạo kiểu sai form yêu cầu</option>
                            <option value="taxi_delay">Tài xế đến trễ / Sự cố Pet Taxi đưa đón</option>
                            <option value="hotel_care">Lưu trú Pet Hotel chăm sóc sai cam kết</option>
                            <option value="attitude">Thái độ phục vụ của nhân viên</option>
                            <option value="other_service">Vấn đề dịch vụ khác</option>
                        </select>
                    </div>
                </div>

                <!-- Card tóm tắt ca dịch vụ đã chọn -->
                <div id="serviceSummaryBox" class="mt-2 p-2 bg-white rounded border small text-muted d-none">
                    <div class="d-flex justify-content-between align-items-center">
                        <span id="summaryServiceName" class="fw-semibold text-dark">-</span>
                        <span id="summaryBookingCode" class="badge bg-light text-secondary border">Mã: -</span>
                    </div>
                    <div class="mt-1 d-flex flex-wrap gap-3">
                        <span>Thú cưng: <strong id="summaryPetName" class="text-dark">-</strong></span>
                        <span>Thời gian: <span id="summaryDateTime">-</span></span>
                        <span>Nhân viên: <span id="summaryStaff">-</span></span>
                    </div>
                </div>
            </div>

            <!-- 3. Ngữ cảnh Đơn hàng (Hiện khi chọn order) -->
            <div id="orderContextSection" class="p-3 mb-3 border rounded-3 d-none support-context-box">
                <div class="d-flex align-items-center gap-2 mb-2 fw-bold text-heading">
                    <span>Thông tin đơn hàng mua sắm cần phản ánh</span>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-7">
                        <label for="orderSelect" class="form-label small fw-semibold">Chọn đơn hàng <span class="text-danger">*</span></label>
                        <select id="orderSelect" class="form-select form-select-sm">
                            <option value="">-- Đang tải danh sách đơn hàng... --</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="orderIssueType" class="form-label small fw-semibold">Vấn đề gặp phải <span class="text-danger">*</span></label>
                        <select id="orderIssueType" class="form-select form-select-sm">
                            <option value="damaged">Sản phẩm bị bể vỡ / móp méo khi giao</option>
                            <option value="wrong_item">Giao sai mẫu mã, chủng loại hoặc thiếu hàng</option>
                            <option value="quality">Sản phẩm lỗi chất lượng / không đúng mô tả</option>
                            <option value="delay">Giao trễ hạn / thất lạc kiện hàng</option>
                            <option value="rma">Yêu cầu Đổi trả hoặc Hoàn tiền (RMA)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-2">
                    <label for="orderCustomerDemand" class="form-label small fw-semibold">Nguyện vọng giải quyết mong muốn</label>
                    <select id="orderCustomerDemand" class="form-select form-select-sm">
                        <option value="exchange">Đổi sản phẩm mới đúng chủng loại (miễn phí vận chuyển)</option>
                        <option value="resend">Gửi bù sản phẩm bị thiếu hoặc bể vỡ</option>
                        <option value="refund">Hoàn tiền về tài khoản thanh toán gốc</option>
                        <option value="voucher">Bồi hoàn Voucher giảm giá hoặc điểm Paw Points</option>
                    </select>
                </div>
            </div>

            <!-- 4. Tiêu đề khiếu nại -->
            <div class="form-group mb-3">
                <label for="ticketTitle" class="form-label fw-bold">Chủ đề khiếu nại / yêu cầu <span class="text-danger">*</span></label>
                <input type="text" id="ticketTitle" class="form-control support-form-input" placeholder="Tóm tắt ngắn gọn vấn đề (Ví dụ: Bé Miu bị trầy xước tai sau khi tắm sấy)" required>
            </div>

            <!-- 5. Nội dung chi tiết -->
            <div class="form-group mb-3">
                <label for="ticketContent" class="form-label fw-bold">Nội dung mô tả chi tiết <span class="text-danger">*</span></label>
                <textarea id="ticketContent" class="form-control support-form-textarea" rows="4" placeholder="Mô tả cụ thể sự việc, thời điểm phát hiện và yêu cầu của bạn để PawPal đối soát camera và xử lý nhanh nhất." required></textarea>
            </div>

            <!-- 6. Minh chứng đính kèm -->
            <div class="form-group mb-4">
                <label class="form-label fw-bold">Hình ảnh hoặc Video minh chứng thực tế (Dưới 5MB)</label>
                <input type="file" id="ticketFile" class="form-control support-form-input" accept="image/*,video/*">
                <div id="filePreviewContainer" class="mt-2 d-none align-items-center gap-3 p-2 border bg-white file-preview-box">
                    <img id="filePreviewImg" src="" alt="Minh chứng" style="width: 56px; height: 56px; object-fit: cover; border-radius: 6px;">
                    <div class="flex-grow-1 small">
                        <div id="filePreviewName" class="fw-semibold text-dark text-truncate" style="max-width: 320px;"></div>
                        <div id="filePreviewSize" class="text-muted"></div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="btnRemoveFile" style="border-radius: 9px; font-size: 12px;">Xóa</button>
                </div>
                <div class="form-text small text-muted">Đính kèm ảnh hiện trạng vết thương của bé hoặc kiện hàng hỏng giúp PawPal xác minh và giải quyết nhanh gấp 2 lần.</div>
            </div>

            <!-- 7. Nút hành động -->
            <div class="d-flex justify-content-end gap-2 pt-3">
                <a href="#support" class="btn-cancel-link text-decoration-none">Hủy bỏ</a>
                <button type="submit" class="btn-support-submit" id="btnSubmitComplaint">Gửi yêu cầu</button>
            </div>
        </form>
    </div>
</div>
