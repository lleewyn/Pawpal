<!-- modules/support/support.html - Module Trung tâm hỗ trợ khách hàng PawPal (Chuẩn AGENTS.md) -->
<div class="support-module-container">
    <div class="dashboard-content-panel">
        <!-- Bộ lọc trạng thái yêu cầu dạng Subtabs chuẩn Text-Only -->
        <div class="support-toolbar-row mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="support-filter-tabs" id="supportFilterTabs" role="tablist">
                <button type="button" class="support-filter-tab active" data-status="all" role="tab" aria-selected="true">
                    Tất cả <span class="tab-count" id="countAll">(0)</span>
                </button>
                <span class="tab-separator">|</span>
                <button type="button" class="support-filter-tab" data-status="pending" role="tab" aria-selected="false">
                    Chờ xử lý <span class="tab-count" id="countPending">(0)</span>
                </button>
                <span class="tab-separator">|</span>
                <button type="button" class="support-filter-tab" data-status="processing" role="tab" aria-selected="false">
                    Đang giải quyết <span class="tab-count" id="countProcessing">(0)</span>
                </button>
                <span class="tab-separator">|</span>
                <button type="button" class="support-filter-tab" data-status="completed" role="tab" aria-selected="false">
                    Hoàn tất <span class="tab-count" id="countCompleted">(0)</span>
                </button>
            </div>
            <a href="#support-create" class="btn-support-create text-decoration-none">Gửi yêu cầu mới</a>
        </div>

        <!-- Bảng danh sách phiếu hỗ trợ -->
        <div class="tickets-table-wrapper" id="ticketsTableArea">
            <table class="tickets-table table align-middle">
                <thead>
                    <tr>
                        <th style="width: 140px;">Mã Ticket</th>
                        <th>Nội dung yêu cầu</th>
                        <th class="text-center" style="width: 150px;">Trạng thái</th>
                        <th class="text-center" style="width: 120px;">Độ ưu tiên</th>
                        <th class="text-center" style="width: 110px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="ticketsListTableBody">
                    <tr>
                        <td><span class="pawpal-skeleton" style="width: 85px; height: 22px;"></span></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <span class="pawpal-skeleton" style="width: 220px; height: 14px;"></span>
                                <span class="pawpal-skeleton" style="width: 130px; height: 12px;"></span>
                            </div>
                        </td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 80px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 60px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 55px; height: 26px;"></span></td>
                    </tr>
                    <tr>
                        <td><span class="pawpal-skeleton" style="width: 85px; height: 22px;"></span></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <span class="pawpal-skeleton" style="width: 260px; height: 14px;"></span>
                                <span class="pawpal-skeleton" style="width: 150px; height: 12px;"></span>
                            </div>
                        </td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 80px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 60px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 55px; height: 26px;"></span></td>
                    </tr>
                    <tr>
                        <td><span class="pawpal-skeleton" style="width: 85px; height: 22px;"></span></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <span class="pawpal-skeleton" style="width: 190px; height: 14px;"></span>
                                <span class="pawpal-skeleton" style="width: 110px; height: 12px;"></span>
                            </div>
                        </td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 80px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 60px; height: 22px;"></span></td>
                        <td class="text-center"><span class="pawpal-skeleton" style="width: 55px; height: 26px;"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- =========================================================
         POPUP MODAL XEM CHI TIẾT PHIẾU HỖ TRỢ (TICKET DETAIL POPUP)
         ========================================================= -->
    <div class="ticket-modal-overlay d-none" id="ticketDetailModalOverlay">
        <div class="ticket-modal-card" id="ticketDetailModalCard" role="dialog" aria-modal="true" aria-labelledby="detailTicketTitle">
            <!-- Modal Header -->
            <div class="ticket-modal-header">
                <div>
                    <div class="d-flex align-items-center gap-2 flex-wrap mb-2" id="detailTicketBadges">
                        <span class="ticket-id-pill" id="detailTicketIdPill">#TK-2026-001</span>
                        <span id="detailTicketStatusBadge"></span>
                        <span id="detailTicketPriorityBadge"></span>
                    </div>
                    <h4 id="detailTicketTitle" class="detail-ticket-title mb-1">Tiêu đề yêu cầu hỗ trợ</h4>
                    <p class="text-muted small mb-0" id="detailTicketSubmeta">Gửi lúc: ...</p>
                </div>
                <button type="button" class="btn-close-detail" id="btnCloseDetailPanel" aria-label="Đóng cửa sổ" title="Đóng (Esc)">Đóng</button>
            </div>

            <!-- Modal Body (Cuộn mượt mà độc lập) -->
            <div class="ticket-modal-body">
                <!-- Thẻ ngữ cảnh Dịch vụ / Đơn hàng -->
                <div id="detailTicketContextCard" class="d-none"></div>

                <!-- Thẻ thông báo phương án giải quyết và bồi hoàn -->
                <div id="detailTicketResolutionCard" class="d-none"></div>

                <!-- Luồng hội thoại trao đổi (Conversational Thread) -->
                <div class="ticket-thread-container mb-4">
                    <div class="thread-header-label mb-2">Trao đổi và Tiến trình xử lý</div>
                    <div class="ticket-timeline-wrapper" id="ticketTimelineMessages"></div>
                </div>

                <!-- Form gửi phản hồi bổ sung -->
                <div class="reply-editor-area" id="replyEditorArea">
                    <div class="form-group mb-3">
                        <label class="reply-label fw-semibold" for="replyTextarea">Gửi phản hồi bổ sung cho CSKH</label>
                        <textarea id="replyTextarea" class="form-control reply-textarea" rows="3" placeholder="Nhập thêm thông tin hoặc gửi phản hồi cho nhân viên CSKH..."></textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-end align-items-center">
                        <button type="button" class="btn-close-ticket" id="btnActionCloseTicket">Đóng hỗ trợ</button>
                        <button type="button" class="btn-send-reply" id="btnSendReply">Gửi phản hồi</button>
                    </div>
                </div>

                <!-- Đánh giá CSKH sau giải quyết -->
                <div class="rating-feedback-area d-none mt-3 p-3" id="ratingFeedbackArea">
                    <div class="rating-box">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="rating-title mb-0">Đánh giá chất lượng hỗ trợ</h6>
                            <button type="button" class="btn-cancel-rating text-muted small border-0 bg-transparent" id="btnCancelRating" style="cursor: pointer; text-decoration: underline;">Quay lại nhập phản hồi</button>
                        </div>
                        <p class="text-muted small mb-2">Bạn có hài lòng với cách xử lý và giải quyết của đội ngũ CSKH PawPal không?</p>
                        <div class="star-rating-holder mb-3 d-flex gap-2 align-items-center flex-wrap" id="ratingStarsGroup">
                            <div class="d-flex gap-1">
                                <button type="button" class="star-btn" data-value="1" title="1 sao">★</button>
                                <button type="button" class="star-btn" data-value="2" title="2 sao">★</button>
                                <button type="button" class="star-btn" data-value="3" title="3 sao">★</button>
                                <button type="button" class="star-btn" data-value="4" title="4 sao">★</button>
                                <button type="button" class="star-btn" data-value="5" title="5 sao">★</button>
                            </div>
                            <span class="rating-score-label small fw-semibold" id="ratingScoreLabel" style="color: #D97706;">5 / 5 sao (Rất hài lòng)</span>
                        </div>
                        <textarea class="form-control rating-comment mb-3" id="ratingComment" rows="2" placeholder="Nhập cảm nghĩ hoặc đóng góp ý kiến cho PawPal (tùy chọn)..."></textarea>
                        <div class="d-flex justify-content-end gap-2 align-items-center">
                            <button type="button" class="btn-close-ticket" id="btnCancelRatingAction">Để sau</button>
                            <button type="button" class="btn-submit-rating" id="btnSubmitRating">Xác nhận hoàn tất và Đánh giá</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
