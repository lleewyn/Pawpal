<!-- modules/support/support.html - Module Trung tâm hỗ trợ khách hàng Pawpal -->
<div class="support-module-container">
    <div class="dashboard-content-panel">
        <div class="section-header-row mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h3 class="section-title-custom mb-1">Yêu cầu hỗ trợ và Phản ánh</h3>
                <p class="text-muted small mb-0">Theo dõi tiến độ xử lý và trao đổi trực tiếp với bộ phận Chăm sóc khách hàng</p>
            </div>
            <a href="/pages/user/support-create/support-create.html" class="btn btn-success btn-sm px-3 rounded-pill text-decoration-none">+ Gửi yêu cầu mới</a>
        </div>

        <!-- Bảng danh sách phiếu hỗ trợ -->
        <div class="tickets-table-wrapper" id="ticketsTableArea">
            <table class="tickets-table table table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 140px;">Mã Ticket</th>
                        <th>Nội dung yêu cầu</th>
                        <th class="text-center" style="width: 150px;">Trạng thái</th>
                        <th class="text-center" style="width: 120px;">Độ ưu tiên</th>
                        <th class="text-center" style="width: 110px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="ticketsListTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- =========================================================
         POPUP MODAL XEM CHI TIẾT PHIẾU HỖ TRỢ (TICKET DETAIL POPUP)
         ========================================================= -->
    <div class="ticket-modal-overlay d-none" id="ticketDetailModalOverlay">
        <div class="ticket-modal-card" id="ticketDetailModalCard" role="dialog" aria-modal="true" aria-labelledby="detailTicketTitle">
            <!-- Modal Header -->
            <div class="ticket-modal-header">
                <div>
                    <div class="d-flex align-items-center gap-2 flex-wrap mb-2" id="detailTicketBadges">
                        <span class="ticket-id-pill" id="detailTicketIdPill">#TK-2026-001</span>
                        <span id="detailTicketStatusBadge"></span>
                        <span id="detailTicketPriorityBadge"></span>
                    </div>
                    <h4 id="detailTicketTitle" class="detail-ticket-title mb-1">Tiêu đề yêu cầu hỗ trợ</h4>
                    <p class="text-muted small mb-0" id="detailTicketSubmeta">Gửi lúc: ...</p>
                </div>
                <button type="button" class="btn-close-detail" id="btnCloseDetailPanel" aria-label="Đóng cửa sổ" title="Đóng (Esc)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Modal Body (Cuộn mượt mà độc lập) -->
            <div class="ticket-modal-body">
                <!-- Thẻ ngữ cảnh Dịch vụ / Đơn hàng -->
                <div id="detailTicketContextCard" class="d-none"></div>

                <!-- Thẻ thông báo phương án giải quyết và bồi hoàn -->
                <div id="detailTicketResolutionCard" class="d-none"></div>

                <!-- Luồng hội thoại trao đổi (Conversational Thread) -->
                <div class="ticket-thread-container mb-4">
                    <div class="thread-header-label mb-2">Trao đổi và Tiến trình xử lý</div>
                    <div class="ticket-timeline-wrapper" id="ticketTimelineMessages"></div>
                </div>

                <!-- Form gửi phản hồi bổ sung -->
                <div class="reply-editor-area" id="replyEditorArea">
                    <div class="form-group mb-3">
                        <label class="reply-label fw-semibold" for="replyTextarea">Gửi phản hồi bổ sung cho CSKH</label>
                        <textarea id="replyTextarea" class="form-control reply-textarea" rows="3" placeholder="Nhập thêm thông tin hoặc gửi phản hồi cho nhân viên CSKH..."></textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-end align-items-center">
                        <button type="button" class="btn btn-outline-danger btn-sm" id="btnActionCloseTicket">Đóng hỗ trợ</button>
                        <button type="button" class="btn btn-success btn-sm px-3" id="btnSendReply">Gửi phản hồi</button>
                    </div>
                </div>

                <!-- Đánh giá CSKH sau giải quyết -->
                <div class="rating-feedback-area d-none mt-3" id="ratingFeedbackArea">
                    <div class="rating-box p-3 border rounded-3 bg-light">
                        <h6 class="mb-2">Đánh giá chất lượng hỗ trợ</h6>
                        <div class="rating-stars mb-2 d-flex gap-1" id="ratingStarsGroup">
                            <span class="star-item cursor-pointer text-warning fs-5" data-val="1">&#9733;</span>
                            <span class="star-item cursor-pointer text-warning fs-5" data-val="2">&#9733;</span>
                            <span class="star-item cursor-pointer text-warning fs-5" data-val="3">&#9733;</span>
                            <span class="star-item cursor-pointer text-warning fs-5" data-val="4">&#9733;</span>
                            <span class="star-item cursor-pointer text-warning fs-5" data-val="5">&#9733;</span>
                        </div>
                        <textarea class="form-control mb-2" id="ratingComment" rows="2" placeholder="Cảm nghĩ của bạn về quá trình hỗ trợ..."></textarea>
                        <button type="button" class="btn btn-primary btn-sm" id="btnSubmitRating">Gửi đánh giá</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
