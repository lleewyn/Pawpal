<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>PawPal - Đơn hàng của tôi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/filter.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/chat.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <link rel="stylesheet" href="../../assets/css/user/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/user/orders.css">
</head>
<body>

    <div id="site-header" style="min-height:110px;background:var(--color-bg-light);"></div>

    <main class="dashboard-container">
        <div class="container-xl py-5">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <!-- Sidebar will be loaded here -->
                        <div class="dashboard-sidebar" style="min-height: 300px;">
                            <p style="text-align: center; padding: 20px; color: #999;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <h3 class="panel-title">Đơn hàng của tôi</h3>
                        
                        <div class="mt-4 text-center text-muted">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
                            <h4>Chưa có đơn hàng nào</h4>
                            <p>Các đơn hàng của bạn sẽ hiển thị ở đây</p>
                            <a href="../public/shop.html" class="btn-cta mt-3">Mua sắm ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/auth.js"></script>
    <script>
        // Authentication Guard
        (function() {
            const currentUser = JSON.parse(localStorage.getItem('pawpal_current_user'));
            if (!currentUser) {
                alert('Vui lòng đăng nhập để truy cập trang này');
                window.location.href = '/pages/public/login.html';
                return;
            }
        })();
        
        // Load sidebar synchronously
        (function loadSidebar() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '../../components/user-sidebar.html', false);
            xhr.send();
            if (xhr.status === 200) {
                document.getElementById('user-sidebar').innerHTML = xhr.responseText;
            }
        })();
    </script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script src="../../assets/js/shared/header-auth.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    <div id="site-fab"></div>
</body>
</html>
