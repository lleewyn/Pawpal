<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Nhật ký chăm sóc - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../../styles/style.css">
    <!-- Components -->
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="pet-diary.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../scripts/api/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../dashboard-init.js"></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../scripts/shared/header-auth.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    <script type="module" src="pet-diary-init.js"></script>
    </head>
<body>
    <div id="site-header"></div>

    <main class="pet-diary-container">
        <div class="container-xl">
            <button type="button" class="dashboard-sidebar-toggle d-lg-none" id="dashboardSidebarToggle" aria-controls="user-sidebar" aria-expanded="false">
                <span class="dashboard-sidebar-toggle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                </span>
                <span class="dashboard-sidebar-toggle-text">Tài khoản</span>
            </button>
            <div class="dashboard-sidebar-backdrop" id="dashboardSidebarBackdrop" hidden></div>
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="pet-diary-content">


                        <!-- Pet Selector -->
                        <div class="pet-selector-wrapper mb-4">
                            <label for="petSelector" class="form-label fw-semibold">Chọn bé cưng</label>
                            <select class="form-select pet-selector" id="petSelector">
                                <option value="">-- Chọn bé cưng để xem nhật ký --</option>
                            </select>
                        </div>

                        <!-- Empty State / Active Services Dashboard (shown initially) -->
                        <div id="dashboardState">
                            <!-- Basic Empty State (no active services) -->
                            <div class="empty-state-diary" id="emptyState" style="display: none;">
                                <div class="empty-icon" style="color: var(--color-primary-light); display: inline-flex; justify-content: center; margin-bottom: var(--space-sm);">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                    </svg>
                                </div>
                                <h4 class="empty-title">Chọn bé cưng để xem nhật ký</h4>
                                <p class="empty-desc">Vui lòng chọn một bé cưng từ danh sách trên để xem lịch sử chăm sóc</p>
                            </div>

                            <!-- Active Services Dashboard -->
                            <div id="activeServicesContainer" style="display: none;">
                                <h4 class="active-services-title">Dịch vụ đang diễn ra</h4>
                                <div class="row g-4 justify-content-center active-services-grid" id="activeServicesGrid">
                                    <!-- Cards will be injected here from template -->
                                </div>
                            </div>
                        </div>

                        <!-- Template for Active Service Card -->
                        <template id="activeServiceCardTemplate">
                            <div class="col-md-6 col-lg-5">
                                <div class="active-service-card">
                                    <div class="active-service-pet-info">
                                        <img src="" alt="" class="active-service-avatar">
                                        <div class="active-service-details">
                                            <h5 class="active-service-name"></h5>
                                            <p class="active-service-type"></p>
                                            <span class="active-service-badge"></span>
                                        </div>
                                    </div>
                                    <button class="btn btn-view-detail active-service-btn">
                                        Vào xem nhật ký
                                    </button>
                                </div>
                            </div>
                        </template>


                        <!-- Diary Content (hidden initially) -->
                        <div class="diary-content-wrapper" id="diaryContent" style="display: none;">

                            <!-- Pet Info Card -->
                            <div class="pet-info-card mb-4" id="petInfoCard">
                                <!-- Will be rendered by JS -->
                            </div>

                            <!-- Timeline và History -->
                            <div class="row g-4">
                                <!-- Timeline -->
                                <div class="col-lg-8">
                                    <div class="timeline-header mb-3">
                                        <h4 class="timeline-title">Dòng thời gian</h4>
                                    </div>
                                    <div class="timeline-wrapper" id="timelineWrapper">
                                        <!-- Timeline items will be rendered here -->
                                    </div>
                                    <div class="empty-timeline" id="emptyTimeline" style="display: none;">
                                        <div class="empty-icon" style="color: var(--color-primary-light);">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                                <line x1="9" y1="9" x2="15" y2="9"></line>
                                                <line x1="9" y1="13" x2="15" y2="13"></line>
                                                <line x1="9" y1="17" x2="15" y2="17"></line>
                                            </svg>
                                        </div>
                                        <p class="empty-desc">Đang chờ cập nhật từ nhân viên</p>
                                    </div>
                                </div>

                                <!-- History Sidebar -->
                                <div class="col-lg-4">
                                    <div class="history-sidebar">
                                        <h4 class="sidebar-title">Lịch sử dịch vụ</h4>
                                        <div class="history-list" id="historyList">
                                            <!-- History items will be rendered here -->
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Toast Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <div id="site-fab"></div>
</body>
</html>
