<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Tạo yêu cầu hỗ trợ - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/chat.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../../assets/css/user/dashboard.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar" style="min-height: 300px;">
                            <p style="text-align: center; padding: 20px; color: #999;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <h3 class="panel-title mb-1">Gửi phiếu hỗ trợ (Ticket)</h3>
                        <p class="text-muted small mb-4">Gửi mô tả sự cố để đội ngũ CSKH của PawPal giải quyết ngay cho chồng iu nhé.</p>

                        <form id="createTicketForm" class="security-form">
                            <div class="form-group mb-3">
                                <label for="ticketTitle" class="form-label">Chủ đề cần hỗ trợ <span class="required-star">*</span></label>
                                <input type="text" id="ticketTitle" class="form-control" placeholder="Nhập chủ đề ngắn gọn (ví dụ: Lỗi trừ tiền Momo)" required>
                            </div>

                            <div class="form-group mb-3">
                                <label for="ticketType" class="form-label">Loại sự cố <span class="required-star">*</span></label>
                                <select id="ticketType" class="form-select" style="border: 1px solid var(--color-border); border-radius: var(--card-border-radius); padding: 12px 16px;" required>
                                    <option value="">-- Chọn loại sự cố --</option>
                                    <option value="payment">Thanh toán & Giao dịch</option>
                                    <option value="booking">Lịch hẹn dịch vụ</option>
                                    <option value="health">Sức khỏe bé cưng</option>
                                    <option value="other">Yêu cầu khác</option>
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label for="ticketContent" class="form-label">Nội dung chi tiết <span class="required-star">*</span></label>
                                <textarea id="ticketContent" class="form-control" rows="5" placeholder="Mô tả cụ thể sự việc để được hỗ trợ tốt nhất nha chồng iu." required></textarea>
                            </div>

                            <div class="form-group mb-4">
                                <label class="form-label">Hình ảnh minh chứng đính kèm (Dưới 5MB)</label>
                                <input type="file" id="ticketFile" class="form-control" accept="image/*">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="support-tickets.html" class="btn-green-outline" style="border-radius: var(--border-radius-pill); padding: 10px 24px;">Hủy bỏ</a>
                                <button type="submit" class="btn-cta" style="padding: 10px 24px;">Gửi yêu cầu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div id="site-fab"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/auth.js"></script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script src="../../assets/js/shared/header-auth.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('createTicketForm');
            const fileInput = document.getElementById('ticketFile');

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const title = document.getElementById('ticketTitle').value;
                const type = document.getElementById('ticketType').value;
                const content = document.getElementById('ticketContent').value;
                
                let files = [];
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 5 * 1024 * 1024) {
                        alert('Dung lượng tệp vượt quá 5MB. Vui lòng gởi minh chứng qua link Zalo hỗ trợ nhé!');
                        return;
                    }
                    files.push(file.name);
                }

                window.PawPalSupport.createTicket(title, type, content, files);
                alert('Phiếu hỗ trợ đã được tạo thành công! PawPal sẽ phản hồi sớm nhất cho chồng iu.');
                window.location.href = 'support-tickets.html';
            });
        });
    </script>
</body>
</html>
