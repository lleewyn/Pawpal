<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="../dashboard-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Tạo yêu cầu hỗ trợ - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../../styles/style.css">
    <!-- Components -->
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="/components/user-sidebar/user-sidebar.css">
    <link rel="stylesheet" href="../support.css">
    <script src="../support-tickets/support-tickets.js" defer></script>
    <!-- Global Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../scripts/api/supabase-client.js"></script>
    <script src="../../../scripts/shared/auth.js" defer></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../components/header/header.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    
</head>
<body>
    <div id="site-header"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <button type="button" class="dashboard-sidebar-toggle d-lg-none" id="dashboardSidebarToggle" aria-controls="user-sidebar" aria-expanded="false">
                <span class="dashboard-sidebar-toggle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                </span>
                <span class="dashboard-sidebar-toggle-text">Tài khoản</span>
            </button>
            <div class="dashboard-sidebar-backdrop" id="dashboardSidebarBackdrop" hidden></div>
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">

                        <p class="text-muted small mb-4">Gửi mô tả sự cố để đội ngũ CSKH của PawPal giải quyết ngay cho bạn nhé.</p>

                        <form id="createTicketForm" class="security-form">
                            <div class="form-group mb-3">
                                <label for="ticketTitle" class="form-label">Chủ đề cần hỗ trợ <span class="required-star">*</span></label>
                                <input type="text" id="ticketTitle" class="form-control" placeholder="Nhập chủ đề ngắn gọn (ví dụ: Lỗi trừ tiền Momo)" required>
                            </div>

                            <div class="form-group mb-3">
                                <label for="ticketType" class="form-label">Loại sự cố <span class="required-star">*</span></label>
                                <select id="ticketType" class="form-select support-form-select" required>
                                    <option value="">-- Chọn loại sự cố --</option>
                                    <option value="payment">Thanh toán và Giao dịch</option>
                                    <option value="booking">Lịch hẹn dịch vụ</option>
                                    <option value="health">Sức khỏe bé cưng</option>
                                    <option value="other">Yêu cầu khác</option>
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label for="ticketContent" class="form-label">Nội dung chi tiết <span class="required-star">*</span></label>
                                <textarea id="ticketContent" class="form-control" rows="5" placeholder="Mô tả cụ thể sự việc để được hỗ trợ tốt nhất." required></textarea>
                            </div>

                            <div class="form-group mb-4">
                                <label class="form-label">Hình ảnh minh chứng đính kèm (Dưới 5MB)</label>
                                <input type="file" id="ticketFile" class="form-control" accept="image/*">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="../support-tickets/support-tickets.html" class="btn-green-outline support-btn-cancel">Hủy bỏ</a>
                                <button type="submit" class="btn-cta support-btn-submit">Gửi yêu cầu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div id="site-fab"></div>
</body>
</html>
