<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Yêu cầu hỗ trợ của tôi - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/chat.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../../assets/css/user/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/user/support.css">
    <script src="../../assets/js/user/support-tickets.js" defer></script>
</head>

<body>
    <div id="site-header"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar" style="min-height: 300px;">
                            <p style="text-align: center; padding: 20px; color: #999;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <!-- Header Section -->
                        <div class="support-header mb-5">
                            <div>
                                <h3 style="font-weight: 700; color: var(--color-primary-dark); margin-bottom: 8px;">Yêu cầu hỗ trợ của bạn</h3>
                                <p class="text-muted small">Theo dõi tiến trình và giao tiếp với nhân viên hỗ trợ</p>
                            </div>
                            <a href="support-create.html" class="btn-cta" style="padding: 10px 24px; font-size: var(--fs-small); white-space: nowrap;">Gửi yêu cầu mới</a>
                        </div>

                        <!-- Tickets Table -->
                        <div class="table-responsive" id="ticketsTableArea">
                            <table class="table align-middle" style="border: 1px solid var(--color-border); border-radius: var(--card-border-radius); overflow: hidden;">
                                <thead style="background: var(--color-neutral-light);">
                                    <tr>
                                        <th scope="col" style="padding: 16px; font-weight: 700; color: var(--color-primary-dark);">Mã Ticket</th>
                                        <th scope="col" style="font-weight: 700; color: var(--color-primary-dark);">Chủ đề</th>
                                        <th scope="col" style="font-weight: 700; color: var(--color-primary-dark);">Trạng thái</th>
                                        <th scope="col" style="font-weight: 700; color: var(--color-primary-dark);">Độ ưu tiên</th>
                                        <th scope="col" style="text-align: right; padding: 16px; font-weight: 700; color: var(--color-primary-dark);">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="ticketsListTableBody">
                                    <!-- JS render tickets list here -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Ticket Detail Panel -->
                        <div class="ticket-detail-modal mt-5" id="ticketDetailPanel" style="display: none; border: 1px solid var(--color-border); border-radius: var(--card-border-radius); padding: 24px; background: var(--color-bg-white);">
                            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                                <div>
                                    <h4 id="detailTicketTitle" style="font-weight: 700; color: var(--color-primary-dark); margin: 0;">#Mã - Tiêu đề</h4>
                                    <p class="text-muted small mb-0" id="detailTicketStatus" style="margin-top: 4px;">Trạng thái: ...</p>
                                </div>
                                <button class="btn-close-panel" id="btnCloseDetailPanel" style="background:none; border:none; font-size: 1.5rem; cursor:pointer; color: var(--color-text-light);">&times;</button>
                            </div>

                            <!-- Messages Timeline -->
                            <div class="ticket-timeline-wrapper" id="ticketTimelineMessages" style="max-height: 400px; overflow-y: auto; padding: 16px; margin-bottom: 24px; background: var(--color-neutral-light); border-radius: 8px;">
                                <!-- JS renders timeline chat messages here -->
                            </div>

                            <!-- Reply Editor -->
                            <div class="reply-editor-area" id="replyEditorArea">
                                <div class="form-group mb-3">
                                    <label style="font-weight: 600; margin-bottom: 8px; display: block; color: var(--color-primary-dark);">Nhập phản hồi của bạn</label>
                                    <textarea id="replyTextarea" class="form-control" rows="3" placeholder="Nhập tin nhắn trả lời..." style="border: 1px solid var(--color-border); border-radius: 8px;"></textarea>
                                </div>
                                <div class="d-flex gap-2 justify-content-end">
                                    <button class="btn-green-outline" id="btnActionCloseTicket" style="border-radius: var(--border-radius-pill); font-weight: 700; padding: 10px 20px;">Đóng hỗ trợ</button>
                                    <button class="btn-cta" id="btnSendReply" style="padding: 10px 24px;">Gửi phản hồi</button>
                                </div>
                            </div>

                            <!-- Rating Area (shown when ticket is completed) -->
                            <div class="rating-feedback-area mt-4 p-4 bg-light rounded" id="ratingFeedbackArea" style="display: none; border: 1px solid var(--color-border);">
                                <h5 style="font-weight: 700; color: var(--color-primary-dark); margin-bottom: 12px;">Đánh giá chất lượng hỗ trợ</h5>
                                <p class="text-muted small mb-3">Ý kiến của bạn giúp PawPal cải thiện dịch vụ!</p>
                                <div class="star-rating-holder mb-3" id="starRatingHolder" style="display: flex; gap: 8px;">
                                    <button class="star-btn" data-value="1" style="background:none; border:none; font-size: 1.5rem; color: var(--color-border); cursor: pointer; transition: all 0.2s;"></button>
                                    <button class="star-btn" data-value="2" style="background:none; border:none; font-size: 1.5rem; color: var(--color-border); cursor: pointer; transition: all 0.2s;"></button>
                                    <button class="star-btn" data-value="3" style="background:none; border:none; font-size: 1.5rem; color: var(--color-border); cursor: pointer; transition: all 0.2s;"></button>
                                    <button class="star-btn" data-value="4" style="background:none; border:none; font-size: 1.5rem; color: var(--color-border); cursor: pointer; transition: all 0.2s;"></button>
                                    <button class="star-btn" data-value="5" style="background:none; border:none; font-size: 1.5rem; color: var(--color-border); cursor: pointer; transition: all 0.2s;"></button>
                                </div>
                                <div class="form-group mb-3">
                                    <label style="font-weight: 600; margin-bottom: 8px; display: block; color: var(--color-primary-dark); font-size: var(--fs-small);">Nhận xét ngắn (tùy chọn)</label>
                                    <input type="text" id="ratingComment" class="form-control" placeholder="Chia sẻ ý kiến của bạn..." style="border: 1px solid var(--color-border); border-radius: 8px;">
                                </div>
                                <button class="btn-cta" id="btnSubmitRating" style="padding: 8px 20px; font-size: var(--fs-small);">Gửi đánh giá</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div id="site-fab"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/auth.js"></script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script src="../../assets/js/shared/header-auth.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    </body>

</html>
