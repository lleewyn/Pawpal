<!DOCTYPE html>
<html lang="vi">

<head>
    <script src="../dashboard-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Yêu cầu hỗ trợ của tôi - PawPal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../../styles/style.css">
    <!-- Components -->
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../support.css">
    <script src="support-tickets.js" defer></script>
    <!-- Global Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../../../scripts/shared/auth.js" defer></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../scripts/shared/header-auth.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    
</head>

<body>
    <div id="site-header"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <!-- Header Section -->
                        <div class="support-header mb-5" style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="font-weight: 700; color: var(--color-primary-dark); margin: 0;">Yêu cầu hỗ trợ của bạn</h3>
                            <a href="../support-create/support-create.html" class="btn-cta btn-new-ticket">Gửi yêu cầu mới</a>
                        </div>

                        <!-- Tickets Table -->
                        <div class="tickets-table-wrapper" id="ticketsTableArea">
                            <table class="tickets-table">
                                <thead>
                                    <tr>
                                        <th>Mã Ticket</th>
                                        <th>Chủ đề</th>
                                        <th class="text-center">Trạng thái</th>
                                        <th class="text-center">Độ ưu tiên</th>
                                        <th class="text-center">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="ticketsListTableBody">
                                    <!-- JS render tickets list here -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Ticket Detail Panel -->
                        <div class="ticket-detail-modal mt-5 d-none" id="ticketDetailPanel">
                            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                                <div>
                                    <h4 id="detailTicketTitle" class="detail-ticket-title">#Mã - Tiêu đề</h4>
                                    <p class="text-muted small mb-0 mt-1" id="detailTicketStatus">Trạng thái: ...</p>
                                </div>
                                <button class="btn-close-panel" id="btnCloseDetailPanel">&times;</button>
                            </div>

                            <!-- Messages Timeline -->
                            <div class="ticket-timeline-wrapper" id="ticketTimelineMessages">
                                <!-- JS renders timeline chat messages here -->
                            </div>

                            <!-- Reply Editor -->
                            <div class="reply-editor-area" id="replyEditorArea">
                                <div class="form-group mb-3">
                                    <label class="reply-label">Nhập phản hồi của bạn</label>
                                    <textarea id="replyTextarea" class="form-control reply-textarea" rows="3" placeholder="Nhập tin nhắn trả lời..."></textarea>
                                </div>
                                <div class="d-flex gap-2 justify-content-end">
                                    <button class="btn-green-outline btn-close-ticket" id="btnActionCloseTicket">Đóng hỗ trợ</button>
                                    <button class="btn-cta btn-send-reply" id="btnSendReply">Gửi phản hồi</button>
                                </div>
                            </div>

                            <!-- Rating Area (shown when ticket is completed) -->
                            <div class="rating-feedback-area mt-4 p-4 bg-light rounded d-none" id="ratingFeedbackArea">
                                <h5 class="rating-title">Đánh giá chất lượng hỗ trợ</h5>
                                <p class="text-muted small mb-3">Ý kiến của bạn giúp PawPal cải thiện dịch vụ!</p>
                                <div class="star-rating-holder mb-3 d-flex gap-2" id="starRatingHolder">
                                    <button class="star-btn" data-value="1"></button>
                                    <button class="star-btn" data-value="2"></button>
                                    <button class="star-btn" data-value="3"></button>
                                    <button class="star-btn" data-value="4"></button>
                                    <button class="star-btn" data-value="5"></button>
                                </div>
                                <div class="form-group mb-3">
                                    <label class="rating-comment-label">Nhận xét ngắn (tùy chọn)</label>
                                    <input type="text" id="ratingComment" class="form-control rating-comment" placeholder="Chia sẻ ý kiến của bạn...">
                                </div>
                                <button class="btn-cta btn-submit-rating" id="btnSubmitRating">Gửi đánh giá</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div id="site-fab"></div>
</body>

</html>
