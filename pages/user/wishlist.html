<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>PawPal - Danh sách yêu thích</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../../assets/css/components/button.css">
    <link rel="stylesheet" href="../../assets/css/components/nav.css">
    <link rel="stylesheet" href="../../assets/css/components/footer.css">
    <link rel="stylesheet" href="../../assets/css/components/modal.css">
    <link rel="stylesheet" href="../../assets/css/components/notification.css">
    <link rel="stylesheet" href="../../assets/css/components/chat.css">
    <link rel="stylesheet" href="../../assets/css/components/fab.css">
    <link rel="stylesheet" href="../../assets/css/user/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/user/wishlist.css">
</head>

<body>

    <div id="site-header" style="min-height:110px;background:var(--color-bg-light);"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <!-- Sidebar will be loaded here -->
                        <div class="dashboard-sidebar" style="min-height: 300px;">
                            <p style="text-align: center; padding: 20px; color: #999;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <div class="wishlist-header">
                            <h3 class="panel-title">Danh sách yêu thích</h3>
                            <p class="wishlist-count">Bạn có <span id="wishlistCount">0</span> sản phẩm yêu thích</p>
                        </div>

                        <!-- Empty State -->
                        <div id="emptyWishlist" class="empty-wishlist">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                            <h4>Chưa có sản phẩm yêu thích</h4>
                            <p>Hãy thêm những sản phẩm ưa thích vào danh sách để dễ dàng tìm lại sau này</p>
                            <a href="../shop/shop.html" class="btn-cta">Khám phá sản phẩm</a>
                        </div>

                        <!-- Wishlist Grid -->
                        <div id="wishlistGrid" class="wishlist-grid" style="display: none;">
                            <!-- Products will be loaded here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/auth.js"></script>
    <script>
        // Authentication Guard
        (function () {
            const currentUser = JSON.parse(localStorage.getItem('pawpal_current_user'));
            if (!currentUser) {
                alert('Vui lòng đăng nhập để truy cập trang này');
                window.location.href = '/pages/public/login.html';
                return;
            }
        })();

        // Load sidebar synchronously
        (function loadSidebar() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '../../components/user-sidebar.html', false);
            xhr.send();
            if (xhr.status === 200) {
                document.getElementById('user-sidebar').innerHTML = xhr.responseText;
            }
        })();
    </script>
    <script src="../../assets/js/shared/components.js" defer></script>
    <script src="../../assets/js/shared/header-auth.js" defer></script>
    <script type="module" src="../../assets/js/shared/main.js"></script>
    <script src="../../assets/js/user/wishlist.js" defer></script>
    <div id="site-fab"></div>
</body>

</html>
