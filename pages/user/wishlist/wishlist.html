<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>PawPal - Danh sách yêu thích</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../../../styles/style.css">
    <!-- Components -->
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="/components/user-sidebar/user-sidebar.css">
    <link rel="stylesheet" href="wishlist.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../scripts/api/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../../../scripts/shared/auth.js" defer></script>
    <script src="../dashboard-init.js"></script>
    <script src="../../../scripts/shared/components.js" defer></script>
    <script src="../../../scripts/shared/header-auth.js" defer></script>
    <script type="module" src="../../../scripts/shared/main.js"></script>
    <script type="module" src="../../../scripts/api/api-global.js"></script>
    <script src="../../../scripts/shared/data-loader.js" defer></script>
    <script src="wishlist.js" defer></script>
</head>

<body>

    <div id="site-header" class="site-header-custom"></div>

    <main class="dashboard-container">
        <div class="container-xl">
            <button type="button" class="dashboard-sidebar-toggle d-lg-none" id="dashboardSidebarToggle" aria-controls="user-sidebar" aria-expanded="false">
                <span class="dashboard-sidebar-toggle-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                </span>
                <span class="dashboard-sidebar-toggle-text">Tài khoản</span>
            </button>
            <div class="dashboard-sidebar-backdrop" id="dashboardSidebarBackdrop" hidden></div>
            <div class="row g-4">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3">
                    <div id="user-sidebar">
                        <!-- Sidebar will be loaded here -->
                        <div class="dashboard-sidebar">
                            <p class="text-center p-4 text-muted">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-lg-9">
                    <div class="dashboard-content-panel">
                        <div class="wishlist-header">
                            <p class="wishlist-count">Bạn có <span id="wishlistCount">0</span> mục yêu thích</p>
                            <div class="wishlist-tabs">
                                <button type="button" class="wishlist-tab active" data-type="all">Tất cả</button>
                                <button type="button" class="wishlist-tab" data-type="product">Sản phẩm</button>
                                <button type="button" class="wishlist-tab" data-type="service">Dịch vụ</button>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div id="emptyWishlist" class="empty-wishlist">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                            <h4>Chưa có mục yêu thích</h4>
                            <p>Hãy lưu sản phẩm hoặc dịch vụ bạn quan tâm để tiện quay lại xem và đặt nhanh hơn</p>
                            <a href="../../shop/shop.html" class="btn-cta">Khám phá ngay</a>
                        </div>

                        <!-- Wishlist Grid -->
                        <div id="wishlistGrid" class="wishlist-grid d-none">
                            <!-- Products will be loaded here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    
    <div id="site-fab"></div>
</body>

</html>
