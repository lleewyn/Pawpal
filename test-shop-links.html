<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Shop Links - PawPal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-link {
            display: block;
            padding: 10px;
            margin: 10px 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
        }
        .test-link:hover {
            background: #e3f2fd;
            border-color: #2196f3;
        }
        .product-card {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
        }
        .product-card a {
            color: #2196f3;
            text-decoration: none;
            font-weight: 500;
        }
        .product-card a:hover {
            text-decoration: underline;
        }
        .info {
            background: #fff3cd;
            padding: 10px;
            border-left: 4px solid #ffc107;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Shop Links</h1>
    
    <div class="info">
        <strong>Mục đích:</strong> Test các link từ trang shop đến trang chi tiết sản phẩm
    </div>

    <div class="test-section">
        <h2>1. Direct Links (Static)</h2>
        <a href="pages/shop/product-detail.html?id=1" class="test-link" target="_blank">
            ➤ Product ID 1 - Royal Canin Mini Adult
        </a>
        <a href="pages/shop/product-detail.html?id=4" class="test-link" target="_blank">
            ➤ Product ID 4 - Kong Classic
        </a>
        <a href="pages/shop/product-detail.html?id=10" class="test-link" target="_blank">
            ➤ Product ID 10 - Frontline Plus
        </a>
    </div>

    <div class="test-section">
        <h2>2. Dynamic Product Cards (như trong shop.js)</h2>
        <div id="productCardsContainer"></div>
    </div>

    <div class="test-section">
        <h2>3. Console Logs</h2>
        <div id="consoleLog" style="background: #1e1e1e; color: #00ff00; padding: 15px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;"></div>
    </div>

    <script>
        // Mock data (giống shop.js)
        const mockProducts = [
            { id: 1, name: 'Royal Canin Mini Adult', brand: 'Royal Canin', price: 250000, oldPrice: 320000, image: 'https://via.placeholder.com/300', sale: true },
            { id: 4, name: 'Kong Classic', brand: 'Kong', price: 150000, oldPrice: null, image: 'https://via.placeholder.com/300', sale: false },
            { id: 10, name: 'Frontline Plus', brand: 'Frontline', price: 280000, oldPrice: null, image: 'https://via.placeholder.com/300', sale: false },
        ];

        // Console log function
        function log(message, type = 'info') {
            const consoleLog = document.getElementById('consoleLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff5555' : type === 'success' ? '#50fa7b' : '#00ff00';
            consoleLog.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            console.log(message);
        }

        // Format price
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        }

        // Create product card HTML (giống shop.js)
        function createProductCard(product) {
            const discountPercent = product.oldPrice ? Math.round((1 - product.price / product.oldPrice) * 100) : 0;
            
            return `
                <div class="product-card">
                    <strong>${product.name}</strong><br>
                    <small>Brand: ${product.brand} | Price: ${formatPrice(product.price)}</small><br>
                    <a href="pages/shop/product-detail.html?id=${product.id}" target="_blank" onclick="handleProductClick(${product.id}, '${product.name}')">
                        ➤ Xem chi tiết sản phẩm
                    </a>
                    ${product.sale ? `<span style="color: red; font-weight: bold;"> (-${discountPercent}%)</span>` : ''}
                </div>
            `;
        }

        // Handle product click
        function handleProductClick(id, name) {
            log(`Clicked product: ID=${id}, Name="${name}"`, 'success');
        }

        // Render products
        function renderProducts() {
            const container = document.getElementById('productCardsContainer');
            container.innerHTML = mockProducts.map(p => createProductCard(p)).join('');
            log(`Rendered ${mockProducts.length} products`, 'success');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('=== Test page loaded ===');
            log(`Current URL: ${window.location.href}`);
            log(`Test products count: ${mockProducts.length}`);
            renderProducts();
            log('=== Ready to test ===', 'success');
        });
    </script>
</body>
</html>
